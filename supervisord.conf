[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=root:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:mariadb]
command=/usr/local/bin/run-mariadb.sh
autostart=true
autorestart=true
startretries=100
startsecs=5
stopsignal=TERM
stopwaitsecs=60
stderr_logfile=/var/log/supervisor/mariadb.err.log
stdout_logfile=/var/log/supervisor/mariadb.out.log
priority=5

[program:sshd]
startretries=100
startsecs=15
command=/usr/sbin/sshd -D
autostart=false
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log
priority=10

[program:hotpocket]
startretries=100
startsecs=15
command=/usr/local/bin/hotpocket/hpcore run /contract
autostart=false
autorestart=true
stderr_logfile=/var/log/supervisor/hotpocket.err.log
stdout_logfile=/var/log/supervisor/hotpocket.out.log
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=100
startsecs=3
stopsignal=QUIT
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
priority=25

[program:openlitespeed]
command=/usr/local/bin/run-openlitespeed.sh
autostart=true
autorestart=true
startretries=100
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stderr_logfile=/var/log/supervisor/openlitespeed.err.log
stdout_logfile=/var/log/supervisor/openlitespeed.out.log
priority=30

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
startretries=100
startsecs=3
stopsignal=TERM
stderr_logfile=/var/log/supervisor/cron.err.log
stdout_logfile=/var/log/supervisor/cron.out.log
priority=35

[program:everlomp-bruteforce-guard]
command=/usr/local/sbin/everlomp-bruteforce-guard
autostart=true
autorestart=true
startretries=100
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stderr_logfile=/var/log/supervisor/everlomp-bruteforce-guard.err.log
stdout_logfile=/var/log/supervisor/everlomp-bruteforce-guard.out.log
priority=40

[program:kopia]
command=/usr/local/bin/run-kopia.sh
autostart=false
autorestart=true
startretries=100
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stderr_logfile=/var/log/supervisor/kopia.err.log
stdout_logfile=/var/log/supervisor/kopia.out.log
priority=45

[program:kopia-admin-api]
command=/usr/local/sbin/everlomp-kopia-priv serve-admin
autostart=true
autorestart=true
startretries=100
startsecs=2
stopsignal=TERM
stopwaitsecs=10
stderr_logfile=/var/log/supervisor/kopia-admin-api.err.log
stdout_logfile=/var/log/supervisor/kopia-admin-api.out.log
priority=43

[program:kopia-replication-api]
command=/usr/local/sbin/everlomp-kopia-replication serve
user=everlomp
directory=/home/everlomp
environment=HOME="/home/everlomp",USER="everlomp",LOGNAME="everlomp"
autostart=true
autorestart=true
startretries=100
startsecs=2
stopsignal=TERM
stopwaitsecs=10
stderr_logfile=/var/log/supervisor/kopia-replication-api.err.log
stdout_logfile=/var/log/supervisor/kopia-replication-api.out.log
priority=44
